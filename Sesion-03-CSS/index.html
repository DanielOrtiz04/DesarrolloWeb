<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería de Productos — Tarea CSS</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <main class="container">
        <h1>Galería de Productos</h1>
        <section class="galeria">

            <article class="producto">
                <img src="https://images.pexels.com/photos/30428606/pexels-photo-30428606.jpeg" alt="Audifonos">
                <div class="producto-info">
                    <h2>Audifonos</h2>
                    <p class="precio">Q99.99</p>
                    <button class="btn-comprar">Comprar</button>
                </div>
            </article>

            <article class="producto">
                <img src="https://images.pexels.com/photos/32545883/pexels-photo-32545883.jpeg" alt="Teclado">
                <div class="producto-info">
                    <h2>Teclado </h2>
                    <p class="precio">Q149.99</p>
                    <button class="btn-comprar">Comprar</button>
                </div>
            </article>

            <article class="producto">
                <img src="https://images.pexels.com/photos/11488107/pexels-photo-11488107.jpeg" alt="Mouse">
                <div class="producto-info">
                    <h2>Mouse</h2>
                    <p class="precio">Q199.99</p>
                    <button class="btn-comprar">Comprar</button>
                </div>
            </article>

            <article class="producto">
                <img src="https://images.pexels.com/photos/8100064/pexels-photo-8100064.jpeg" alt="Monitor">
                <div class="producto-info">
                    <h2>Monitor </h2>
                    <p class="precio">Q79.99</p>
                    <button class="btn-comprar">Comprar</button>
                </div>
            </article>

            <article class="producto">
                <img src="https://images.pexels.com/photos/30469971/pexels-photo-30469971.jpeg" alt="Pc Gamer">
                <div class="producto-info">
                    <h2>Pc Gamer</h2>
                    <p class="precio">Q249.99</p>
                    <button class="btn-comprar">Comprar</button>
                </div>
            </article>

            <article class="producto">
                <img src="https://media.istockphoto.com/id/1263458593/es/foto/silla-de-juego-c%C3%B3moda-en-negro-y-rojo-aislado-sobre-un-fondo-blanco-muebles-para-los-jugadores.jpg?b=1&s=612x612&w=0&k=20&c=WDbixWjjHCf6TKw_ris5ppYFfzWKC0fCR1nYF-jHt1I=" alt="Silla de Juego">
                <div class="producto-info">
                    <h2>Silla de Juego</h2>
                    <p class="precio">Q299.99</p>
                    <button class="btn-comprar">Comprar</button>
                </div>
            </article>

        </section>

        <h2>To-Do List</h2>
        <section class="todo-list">
            <ul class="tareas" role="list">
                <li class="tarea">
                    <input type="checkbox" id="t1">
                    <label for="t1">Aprender CSS Grid</label>
                </li>
                <li class="tarea">
                    <input type="checkbox" id="t2">
                    <label for="t2">Practicar Flexbox</label>
                </li>
                <li class="tarea">
                    <input type="checkbox" id="t3">
                    <label for="t3">Estudiar diseño responsivo</label>
                </li>
                <li class="tarea">
                    <input type="checkbox" id="t4">
                    <label for="t4">Hacer la tarea de CSS</label>
                </li>
                <li class="tarea">
                    <input type="checkbox" id="t5">
                    <label for="t5">Revisar novedades de CSS 2024</label>
                </li>
            </ul>
        </section>
    </main>

</body>
</html>
